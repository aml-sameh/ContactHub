<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ContactHub</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar bg-white border-bottom">
        <div class="container">

            <a class="navbar-brand d-flex align-items-center gap-3" href="#">
                <div class="logo-icon">
                    <i class="fa-solid fa-address-book"></i>
                </div>

                <div>
                    <h3 class="mb-0 fw-bold">
                        Contact<span>Hub</span>
                    </h3>

                    <small class="text-secondary navbar-subtitle">
                        Smart Contact Manager
                    </small>
                </div>
            </a>

            <div class="d-flex align-items-center gap-4 nav-actions">

                <button class="btn add-btn d-inline-flex align-items-center gap-2"
                    data-bs-toggle="modal"
                    data-bs-target="#addContactModal">

                    <i class="fa-solid fa-plus"></i>

                    <span class="add-text">Add Contact</span>
                    <span class="add-short">Add</span>

                </button>

                <i class="fa-solid fa-bell nav-icon nav-bell"></i>

                <i class="fa-solid fa-gear nav-icon nav-gear"></i>

                <img src="image/avatar-2 (1).jpg" class="profile-img" alt="Profile">

            </div>

        </div>
    </nav>

    <main>

        <section class="container py-4">

            <div class="row g-4">

                <div class="col-6 col-lg-4">
                    <div class="card stat-card border-0 shadow-sm rounded-4 p-4">

                        <div class="d-flex align-items-center gap-3">

                            <div class="stat-icon total-icon">
                                <i class="fa-solid fa-users"></i>
                            </div>

                            <div>
                                <p class="mb-1 text-secondary">TOTAL</p>
                                <h3 id="totalCount" class="mb-0 fw-bold">0</h3>
                            </div>

                        </div>

                    </div>
                </div>

                <div class="col-6 col-lg-4">
                    <div class="card stat-card border-0 shadow-sm rounded-4 p-4">

                        <div class="d-flex align-items-center gap-3">

                            <div class="stat-icon favorite-icon">
                                <i class="fa-solid fa-star"></i>
                            </div>

                            <div>
                                <p class="mb-1 text-secondary">FAVORITES</p>
                                <h3 id="favoriteCount" class="mb-0 fw-bold">0</h3>
                            </div>

                        </div>

                    </div>
                </div>

                <div class="col-6 col-lg-4">
                    <div class="card stat-card border-0 shadow-sm rounded-4 p-4">

                        <div class="d-flex align-items-center gap-3">

                            <div class="stat-icon emergency-icon">
                                <i class="fa-solid fa-heart-pulse"></i>
                            </div>

                            <div>
                                <p class="mb-1 text-secondary">EMERGENCY</p>
                                <h3 id="emergencyCount" class="mb-0 fw-bold">0</h3>
                            </div>

                        </div>

                    </div>
                </div>

            </div>

        </section>

        <section class="container pb-5">

            <div class="row g-4">

                <div class="col-12 col-xl-8">

                    <div class="mb-4">

                        <h1 class="fw-bold mb-1">
                            All Contacts
                        </h1>

                        <p id="contactsSubtitle" class="text-secondary mb-0">
                            Manage and organize your contacts
                        </p>

                    </div>

                    <div class="search-box mb-4">

                        <i class="fa-solid fa-magnifying-glass"></i>

                        <input type="text"
                            id="searchInput"
                            class="form-control border-0"
                            placeholder="Search by name, phone, or email...">

                    </div>

                    <div id="contactsContainer" class="row g-4"></div>

                </div>

                <div class="col-12 col-xl-4">

                    <div class="side-card card border-0 shadow-sm rounded-4 mb-4">

                        <div class="side-header favorite-header">

                            <div class="side-icon favorite-side-icon">
                                <i class="fa-solid fa-star"></i>
                            </div>

                            <div>

                                <h5 class="mb-1 fw-bold">
                                    Favorites
                                </h5>

                                <p class="mb-0">
                                    Quick access to starred contacts
                                </p>

                            </div>

                        </div>

                        <div id="favoritesContainer" class="empty-state">
                            No favorites yet
                        </div>

                    </div>

                    <div class="side-card card border-0 shadow-sm rounded-4">

                        <div class="side-header emergency-header">

                            <div class="side-icon emergency-side-icon">
                                <i class="fa-solid fa-heart-pulse"></i>
                            </div>

                            <div>

                                <h5 class="mb-1 fw-bold">
                                    Emergency
                                </h5>

                                <p class="mb-0">
                                    Important contacts for urgent calls
                                </p>

                            </div>

                        </div>

                        <div id="emergencyContainer" class="empty-state">
                            No emergency contacts
                        </div>

                    </div>

                </div>

            </div>

        </section>

    </main>

    <div class="modal fade" id="addContactModal" tabindex="-1">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content add-modal">

                <div class="modal-header">

                    <h4 class="modal-title fw-bold">
                        Add New Contact
                    </h4>

                    <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                    </button>

                </div>

                <div class="modal-body">

                    <div class="text-center mb-4">

                        <div id="photoPreview" class="contact-photo">
                            <i class="fa-solid fa-user"></i>
                        </div>

                        <label for="contactPhoto" class="change-photo-btn mt-3">
                            <i class="fa-solid fa-camera"></i>
                            Change Photo
                        </label>

                        <input type="file"
                            id="contactPhoto"
                            class="d-none"
                            accept="image/*">

                    </div>

                    <form id="contactForm" novalidate>

                        <div class="mb-4">

                            <label for="fullName" class="form-label">
                                Full Name <span>*</span>
                            </label>

                            <input type="text"
                                id="fullName"
                                class="form-control"
                                placeholder="Enter full name">

                            <div id="nameError" class="error-message"></div>

                        </div>

                        <div class="mb-4">

                            <label for="phoneNumber" class="form-label">
                                Phone Number <span>*</span>
                            </label>

                            <input type="text"
                                id="phoneNumber"
                                class="form-control"
                                placeholder="e.g., 01012345678">

                            <div id="phoneError" class="error-message"></div>

                        </div>

                        <div class="mb-4">

                            <label for="emailAddress" class="form-label">
                                Email Address
                            </label>

                            <input type="email"
                                id="emailAddress"
                                class="form-control"
                                placeholder="name@example.com">

                            <div id="emailError" class="error-message"></div>

                        </div>

                        <div class="mb-2">

                            <label for="address" class="form-label">
                                Address
                            </label>

                            <input type="text"
                                id="address"
                                class="form-control"
                                placeholder="Enter address">

                        </div>

                    </form>

                </div>

                <div class="modal-footer">

                    <button type="button"
                        class="btn btn-light cancel-btn"
                        data-bs-dismiss="modal">
                        Cancel
                    </button>

                    <button type="submit"
                        form="contactForm"
                        class="btn save-btn d-inline-flex align-items-center gap-2">

                        <i class="fa-solid fa-check"></i>
                        Save

                    </button>

                </div>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous">
    </script>

    <script src="index.js"></script>

</body>

</html>
